<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonesy Mk.2 Control Panel</title>
  <link href="output.css" rel="stylesheet" />
  <script src="dygraph.min.js"></script>
  <script src="jquery.min.js"></script>
  <script>
    $(document).ready(function () {
      let data = [];

      let launchIndex = 0;

      function launch() {
        $.get('/start');
        launchIndex = g.numRows();
      }

      window.launch = launch;

      const g = new Dygraph(document.getElementById("chart"), data, {
        drawPoints: true,
        interactionModel: {},
        underlayCallback: function (canvas, area, g) {
          canvas.fillStyle = "rgba(0, 255, 0, 0.15)";
          for (let i = 0; i < g.numRows() - 1; i++) {
            const y1 = g.getValue(i, 1);
            const y2 = g.getValue(i + 1, 1);

            const x1 = g.getValue(i, 0);
            const x2 = g.getValue(i + 1, 0);

            if (y1 >= 2 && y1 <= 3 && y2 >= 2 && y2 <= 3) {
              const xStart = g.toDomXCoord(x1);
              const xEnd = g.toDomXCoord(x2);
              const width = xEnd - xStart;
              canvas.fillRect(xStart, area.y, width, area.h);
            }
          }
        }
      });

      const ws = new WebSocket("ws://192.168.0.1/ws");
      ws.onmessage = function (event) {
        const logs = document.getElementById("logs");
        const scrollAtBottom =
          logs.scrollTop + logs.clientHeight == logs.scrollHeight;
        logs.textContent += event.data;
        if (scrollAtBottom) logs.scrollTop = logs.scrollHeight;
      };

      setInterval(function () {
        $.get("/data", function (dot) {
          data = dot;
          g.updateOptions({ file: data });
          if (launchIndex > data.length) launchIndex = 0;
          let count = data.slice(launchIndex).filter(d => d[1] >= 2 && d[1] <= 3).length;
          document.getElementById("rangeCount").textContent = `Points between 2 and 3 meter range: ${count}`;
        });
      }, 1000);
    });
  </script>
</head>
<body class="bg-[#323232] text-white font-mono p-1">
  <h1 class="mt-0 text-2xl text-center mb-2">Jonesy Mk.2 Control Panel</h1>
  <div class="grid grid-cols-2 grid-rows-1 gap-4">
    <div>
      <button onclick="launch()" class="text-2xl font-bold rounded-lg px-6 py-4 border-none bg-red-600 text-white cursor-pointer active:bg-red-700 w-full">Launch</button>
      <div class="console bg-[#222] h-[512px] rounded-xl overflow-auto">
        <pre id="logs" class="text-left font-mono font-normal ml-2 mt-1 whitespace-pre-line"></pre>
      </div>
      <h2 id="rangeCount" class="pt-2 text-xl">Points between 2 and 3 meter range: 0</h2>
    </div>
    <div class="w-full h-full">
      <div class="flex w-full h-full justify-start">
        <div class="flex items-center justify-center w-8">
          <p class="-rotate-90 transform origin-center whitespace-nowrap">Depth (m)</p>
        </div>
        <div id="chart" class="w-full h-full"></div>
      </div>
      <p class="text-center">Time (s)</p>
    </div>
  </div>
</body>
</html>
